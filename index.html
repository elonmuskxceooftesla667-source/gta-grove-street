<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GTA Grove Street - Pixel Art</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.pill{background:rgba(0,0,0,.7);padding:7px 10px;border-radius:20px;font-weight:900;font-size:13px;border:1px solid #fff}
#mission{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#111;border:2px solid #00ff88;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:900;z-index:10;text-align:center;white-space:nowrap}
#controls{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:10;align-items:flex-end}
#joy{width:120px;height:120px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.7);border-radius:50%;position:relative}
#knob{width:50px;height:50px;background:#fff;border-radius:50%;position:absolute;left:35px;top:35px}
.b{width:68px;height:58px;border-radius:14px;border:2px solid #fff;color:#fff;font-weight:900;font-size:11px}
#start{position:fixed;inset:0;background:#0a3d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center;padding:20px}
#start h1{font-size:48px;line-height:.95}#start h1 span{color:#00ff88}
#startBtn{margin-top:18px;padding:15px 38px;font-size:20px;font-weight:900;background:#00ff88;border:3px solid #fff;border-radius:40px}
#wasted{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99}
#wasted h2{font-size:60px;color:red}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill">❤️ <span id="hp">100</span> | 💰 $<span id="cash">250</span></div><div class="pill">⭐ <span id="st">☆☆☆☆☆</span></div></div>
<div id="mission">🏠 GROVE STREET - Steal a car, fight Ballas!</div>
<div id="controls"><div id="joy"><div id="knob"></div></div><div style="display:flex;flex-direction:column;gap:8px"><button class="b" style="background:#3498db" id="carBtn">🚗 CAR</button><button class="b" style="background:#e74c3c" id="punchBtn">👊 PUNCH</button><button class="b" style="background:#f39c12" id="runBtn">🏃 RUN</button></div></div>
<div id="start"><h1>GTA<br><span>GROVE STREET</span><br><span style="font-size:16px;color:#fff">PIXEL ART EDITION</span></h1><p style="margin-top:12px">Real CJ • Real Cars • Big Map<br>Top-down like GTA 1 & 2</p><button id="startBtn" onclick="startG()">▶ START GAME</button></div>
<div id="wasted"><h2>WASTED</h2><button onclick="respawn()" style="padding:12px 24px;font-size:18px;font-weight:900;border-radius:20px;margin-top:16px">🔄 TRY AGAIN</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
let started=false,run=false,joy={x:0,y:0};
let P={x:1050,y:1050,a:0,hp:100,money:250,wanted:0,car:null,punch:0,dead:false,walk:0};
let cam={x:1050,y:1050};let cars=[],peds=[],cops=[];
const WORLD=2400;
let houses=[];for(let i=0;i<16;i++)houses.push({x:180+(i%4)*560,y:180+Math.floor(i/4)*560,w:200,h:130,c:['#f1c40f','#e67e22','#1abc9c','#9b59b6'][i%4]});
for(let i=0;i<12;i++)cars.push({x:300+Math.random()*1800,y:300+Math.random()*1800,a:Math.random()*6.28,sp:0,color:['#ff2d2d','#2d9cff','#ffde00','#00c853','#ff6bff','#fff','#ff8c00','#00bcd4'][i%8]});
for(let i=0;i<9;i++)peds.push({x:400+Math.random()*1600,y:400+Math.random()*1600,a:0,hp:100,team:i<4?'ballas':'civil',walk:0});
function startG(){started=true;document.getElementById('start').style.display='none';setTimeout(()=>document.getElementById('mission').style.display='none',5000);}
function respawn(){P.hp=100;P.x=1050;P.y=1050;P.dead=false;P.wanted=0;document.getElementById('wasted').style.display='none';}
// joystick
let jEl=document.getElementById('joy'),kn=document.getElementById('knob');
function jm(e){let r=jEl.getBoundingClientRect();let t=e.touches?e.touches[0]:e;let dx=(t.clientX-r.left-60)/50,dy=(t.clientY-r.top-60)/50;let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;kn.style.left=(35+dx*25)+'px';kn.style.top=(35+dy*25)+'px';}
function je(){joy.x=0;joy.y=0;kn.style.left='35px';kn.style.top='35px';}
jEl.addEventListener('touchstart',jm);jEl.addEventListener('touchmove',jm);jEl.addEventListener('touchend',je);
document.getElementById('runBtn').onclick=()=>{run=!run};
document.getElementById('punchBtn').onclick=()=>{if(!P.car)P.punch=14};
document.getElementById('carBtn').onclick=()=>{
 if(P.car){P.car=null;P.x+=34;return}
 let best=null,bd=100;for(let c of cars){let d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;best=c}}
 if(best)P.car=best;
};
function drawPerson(x,y,a,isCJ,isBallas,walk){
 ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,6,14,8,0,0,7);ctx.fill();
 // legs - walking animation
 let legSwing=Math.sin(walk)*5;
 ctx.fillStyle=isCJ?'#1a1a1a':'#222';ctx.fillRect(-7,6+legSwing,6,12);ctx.fillRect(1,6-legSwing,6,12);
 // body - green for CJ, purple for Ballas, white for civil
 ctx.fillStyle=isCJ?'#00a651':isBallas?'#7d3cff':'#ecf0f1';ctx.fillRect(-9,-8,18,18);
 ctx.fillStyle='#000';ctx.fillRect(-9,-8,18,3);
 // arms
 ctx.fillStyle='#fdcb9e';ctx.fillRect(-13,-4,4,12);ctx.fillRect(9,-4,4,12);
 // head - skin tone + cap
 ctx.fillStyle='#8d5524';ctx.beginPath();ctx.arc(0,-14,9,0,7);ctx.fill();
 ctx.fillStyle=isCJ?'#fff':'#111';ctx.fillRect(-9,-22,18,5);ctx.fillRect(-9,-22,18,2);
 ctx.fillStyle='#111';ctx.fillRect(-3,-16,2,2);ctx.fillRect(2,-16,2,2);
 ctx.restore();
 // name
 if(isCJ){ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('CJ',x,y-32)}
 if(isBallas){ctx.font='bold 11px Arial';ctx.fillText('BALLA',x,y-32)}
}
function drawCar(c){
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-36,-20,72,40);
 // wheels - black
 ctx.fillStyle='#111';ctx.fillRect(-28,-24,14,8);ctx.fillRect(-28,16,14,8);ctx.fillRect(14,-24,14,8);ctx.fillRect(14,16,14,8);
 // body
 ctx.fillStyle=c.color;ctx.beginPath();ctx.roundRect(-34,-18,68,36,8);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-30,-14,60,6);
 // windshield + windows
 ctx.fillStyle='#bfeaff';ctx.fillRect(-6,-15,14,30);
 ctx.fillStyle='#222';ctx.fillRect(-12,-15,4,30);ctx.fillRect(10,-15,4,30);
 // headlights
 ctx.fillStyle='#ffffaa';ctx.fillRect(32,-12,3,6);ctx.fillRect(32,6,3,6);
 ctx.fillStyle='#ff2222';ctx.fillRect(-35,-12,3,6);ctx.fillRect(-35,6,3,6);
 // roof
 ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(-2,-13,10,26);
 ctx.restore();
}
function update(){
 if(!started||P.dead)return;
 let ix=joy.x,iy=joy.y,m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
 let car=P.car;
 if(car){
   if(m>0.1){car.a=Math.atan2(iy,ix);car.sp=Math.min(car.sp+0.6,run?10:7)}else car.sp*=0.92;
   car.x+=Math.cos(car.a)*car.sp;car.y+=Math.sin(car.a)*car.sp;P.x=car.x;P.y=car.y;P.a=car.a;
   for(let p of peds){if(Math.hypot(p.x-car.x,p.y-car.y)<30&&car.sp>3){p.hp-=40;P.money+=10;P.wanted=Math.min(5,P.wanted+1)}}
 } else {
   let sp=(run?4.5:2.8)*(m>0.1?1:0);if(m>0.1)P.a=Math.atan2(iy,ix);
   P.x+=ix*sp;P.y+=iy*sp;P.walk+=sp*0.4;
   if(P.punch>0){P.punch--;for(let p of peds){if(Math.hypot(p.x-P.x,p.y-P.y)<44){p.hp-=2;if(p.hp<=0)P.money+=50}}}
 }
 P.x=Math.max(40,Math.min(WORLD-40,P.x));P.y=Math.max(40,Math.min(WORLD-40,P.y));
 for(let p of peds){
   if(p.hp<=0){p.x=300+Math.random()*1800;p.y=300+Math.random()*1800;p.hp=100;continue}
   if(p.team==='ballas'){
     let d=Math.hypot(P.x-p.x,P.y-p.y);
     if(d<240&&!car){p.x+=(P.x-p.x)/d*1.5;p.y+=(P.y-p.y)/d*1.5;p.a=Math.atan2(P.y-p.y,P.x-p.x);p.walk+=0.3;if(d<30)P.hp-=0.4}
     else{p.x+=Math.cos(p.a)*0.7;p.y+=Math.sin(p.a)*0.7;p.walk+=0.1;if(Math.random()<0.01)p.a=Math.random()*6.28}
   } else {p.x+=Math.cos(p.a)*0.8;p.y+=Math.sin(p.a)*0.8;p.walk+=0.1;if(Math.random()<0.01)p.a=Math.random()*6.28}
 }
 if(P.wanted>0&&cops.length<P.wanted*2&&Math.random()<0.02)cops.push({x:P.x+400,y:P.y+400});
 for(let c of cops){let d=Math.hypot(P.x-c.x,P.y-c.y);if(d>10){c.x+=(P.x-c.x)/d*2.3;c.y+=(P.y-c.y)/d*2.3}if(d<30)P.hp-=0.3}
 if(P.hp<=0){P.dead=true;document.getElementById('wasted').style.display='flex'}
 document.getElementById('hp').textContent=Math.ceil(P.hp);document.getElementById('cash').textContent=P.money;document.getElementById('st').textContent='★'.repeat(P.wanted)+'☆'.repeat(5-P.wanted);
 cam.x+=(P.x-cam.x)*0.12;cam.y+=(P.y-cam.y)*0.12;
}
function draw(){
 ctx.fillStyle='#2d5a27';ctx.fillRect(0,0,W,H);
 if(!started)return;
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(0.65,0.65);ctx.translate(-cam.x,-cam.y);
 // ground
 ctx.fillStyle='#3a6b2e';ctx.fillRect(0,0,WORLD,WORLD);
 // roads
 ctx.fillStyle='#333';ctx.fillRect(0,0,WORLD,120);ctx.fillRect(0,1100,WORLD,130);ctx.fillRect(0,2100,WORLD,130);
 ctx.fillRect(0,0,130,WORLD);ctx.fillRect(1100,0,130,WORLD);ctx.fillRect(2100,0,130,WORLD);
 ctx.fillStyle='#ffde00';for(let x=0;x<WORLD;x+=70){ctx.fillRect(x,58,32,6);ctx.fillRect(x,1158,32,6);ctx.fillRect(x,2158,32,6)}
 for(let y=0;y<WORLD;y+=70){ctx.fillRect(58,y,6,32);ctx.fillRect(1158,y,6,32);ctx.fillRect(2158,y,6,32)}
 // houses with driveways
 for(let h of houses){
   ctx.fillStyle='#aaa';ctx.fillRect(h.x-12,h.y-12,h.w+24,h.h+24);
   ctx.fillStyle=h.c;ctx.fillRect(h.x,h.y,h.w,h.h);
   ctx.fillStyle='#333';ctx.fillRect(h.x,h.y,h.w,16);
   ctx.fillStyle='#fff';ctx.fillRect(h.x+18,h.y+50,32,38);ctx.fillRect(h.x+h.w-50,h.y+50,32,38);
   ctx.fillStyle='#7a4a00';ctx.fillRect(h.x+h.w/2-18,h.y+70,36,50);
   ctx.fillStyle='#555';ctx.fillRect(h.x+h.w/2-25,h.y+h.h,50,35);
 }
 // Grove Street sign small at top
 ctx.fillStyle='#006400';ctx.fillRect(1080,1020,220,32);ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('GROVE STREET',1190,1042);
 for(let c of cars)drawCar(c);
 for(let p of peds)drawPerson(p.x,p.y,p.a,false,p.team==='ballas',p.walk);
 for(let c of cops){ctx.fillStyle='#0033ff';ctx.beginPath();ctx.arc(c.x,c.y,14,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('👮',c.x,c.y+6)}
 if(P.car)drawCar(P.car);
 else drawPerson(P.x,P.y,P.a,true,false,P.walk);
 ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
